<!DOCTYPE html>

    <title>書曼的旅遊相簿</title>
    <style>
        body {
            background: #333333;
        }

        #main {
            background: #ffffcc;
            width: 1024px;
            height: 768px;
            margin: auto;
        }

        #left {
            width: 150px;
            height: 768px;
            float: left;
        }

        #right {
            width: calc(1024px - 150px);
            height: 768px;
            float: right;
        }

        #content {
            /* 1. 原始盒模型計算方式 */
            /* width: calc(1024px - 150px - 72px);
            height: calc(768px - 50px - 72px);
            padding: 36px; */
            /* 2. box-sizing: border-box ，因為 padding和border都計算在width和height內*/
            width: calc(1024px - 150px);
            height: calc(768px - 50px);
            padding: 36px;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
        }

        marquee {
            width: calc(1024px - 150px);
            height: 50px;
            font-size: 24px;
            font-family: "標楷體";
            font-weight: bold;
            color: #ff0000;
            text-align: center;
            line-height: 50px;
            /* vertical-align: middle 可不打，消除下方多出的部分 */
            vertical-align: middle;
        }

        #left table {
            margin: auto;
            text-align: center;
        }

        .info {
            font-size: 12px;
            font-weight: bold;
            font-family: "新細明體";
            color: #ff0000;
        }

        /* 程式有問題無法正常運作時使用，有風險被抓到 */
        #left .img:hover {
            filter: hue-rotate(120deg);
        }
    </style>
</head>
